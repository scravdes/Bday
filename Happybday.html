<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Heart with Birthday Text</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #birthday-text {
            position: absolute;
            z-index: 2;
            font-family: 'Great Vibes', cursive;
            font-size: 5rem;
            color: #e0f2fe;
            text-align: center;
            text-shadow:
                0 0 10px #38bdf8,
                0 0 20px #38bdf8,
                0 0 40px #2563eb,
                0 0 80px #2563eb;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 2s ease-in-out, transform 2s ease-in-out;
            pointer-events: none;
            user-select: none;
        }
        #birthday-text.show {
            opacity: 1;
            transform: scale(1);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="birthday-text">Happy Birthday Uche</div>

<script>
const textElement = document.getElementById('birthday-text');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 28;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const BLUE_SHADES = [
    new THREE.Color('#38bdf8'),
    new THREE.Color('#60a5fa'),
    new THREE.Color('#3b82f6'),
    new THREE.Color('#1d4ed8'),
    new THREE.Color('#93c5fd'),
    new THREE.Color('#ffffff')
];

const HEART_COUNT = 7000;
const heartGeo = new THREE.BufferGeometry();
const heartPos = new Float32Array(HEART_COUNT * 3);
const heartColors = new Float32Array(HEART_COUNT * 3);
const targetPos = new Float32Array(HEART_COUNT * 3);
const velocities = new Float32Array(HEART_COUNT * 3);

function getFull3DHeartPoint() {
    let x, y, r;
    while (true) {
        r = Math.sqrt(Math.random());
        const t = Math.random() * Math.PI * 2;

        const scale = 0.6;
        const xOutline = scale * 16 * Math.pow(Math.sin(t), 3);
        const yOutline = scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

        x = xOutline * r;
        y = yOutline * r;
        break;
    }

    const maxThickness = 5.5;
    const depthProfile = Math.sqrt(Math.max(0, 1 - r * r));
    const z = (Math.random() * 2 - 1) * maxThickness * depthProfile;

    return { x, y, z };
}

for (let i = 0; i < HEART_COUNT; i++) {
    const pt = getFull3DHeartPoint();

    heartPos[i*3]     = pt.x;
    heartPos[i*3 + 1] = pt.y;
    heartPos[i*3 + 2] = pt.z;

    targetPos[i*3]     = pt.x;
    targetPos[i*3 + 1] = pt.y;
    targetPos[i*3 + 2] = pt.z;

    velocities[i*3]     = 0;
    velocities[i*3 + 1] = 0;
    velocities[i*3 + 2] = 0;

    const col = BLUE_SHADES[Math.floor(Math.random() * BLUE_SHADES.length)];
    heartColors[i*3]     = col.r;
    heartColors[i*3 + 1] = col.g;
    heartColors[i*3 + 2] = col.b;
}

heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

const canvasTex = document.createElement('canvas');
canvasTex.width = 16; canvasTex.height = 16;
const ctx = canvasTex.getContext('2d');
const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
grad.addColorStop(0, 'rgba(255,255,255,1)');
grad.addColorStop(0.3, 'rgba(56,189,248,0.8)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, 16, 16);
const pTexture = new THREE.CanvasTexture(canvasTex);

const heartMat = new THREE.PointsMaterial({
    size: 0.38,
    vertexColors: true,
    map: pTexture,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const heartMesh = new THREE.Points(heartGeo, heartMat);
scene.add(heartMesh);

let isExploded = false;

window.addEventListener('click', () => {
    if (isExploded) {
        // Reset po ponownym kliknięciu
        isExploded = false;
        heartMat.opacity = 1;
        textElement.classList.remove('show');

        const pos = heartGeo.attributes.position.array;
        for (let i = 0; i < HEART_COUNT; i++) {
            pos[i*3]     = targetPos[i*3];
            pos[i*3 + 1] = targetPos[i*3 + 1];
            pos[i*3 + 2] = targetPos[i*3 + 2];
        }
        return;
    }

    isExploded = true;
    textElement.classList.add('show');

    for (let i = 0; i < HEART_COUNT; i++) {
        const vx = (targetPos[i*3]     + (Math.random() - 0.5) * 4) * (Math.random() * 0.7 + 0.3);
        const vy = (targetPos[i*3 + 1] + (Math.random() - 0.5) * 4) * (Math.random() * 0.7 + 0.3);
        const vz = (targetPos[i*3 + 2] + (Math.random() - 0.5) * 6) * (Math.random() * 0.7 + 0.3);

        velocities[i*3]     = vx;
        velocities[i*3 + 1] = vy;
        velocities[i*3 + 2] = vz;
    }
});

let clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const time = clock.getElapsedTime();
    const pos = heartGeo.attributes.position.array;

    if (!isExploded) {
        heartMesh.rotation.y = Math.sin(time * 0.7) * 0.45;
        heartMesh.rotation.x = Math.cos(time * 0.4) * 0.15;

        for (let i = 0; i < HEART_COUNT; i++) {
            pos[i*3]     = targetPos[i*3]     + Math.sin(time * 2 + i) * 0.04;
            pos[i*3 + 1] = targetPos[i*3 + 1] + Math.cos(time * 2 + i) * 0.04;
            pos[i*3 + 2] = targetPos[i*3 + 2] + Math.sin(time * 2.5 + i) * 0.04;
        }
    } else {
        for (let i = 0; i < HEART_COUNT; i++) {
            pos[i*3]     += velocities[i*3]     * 0.025;
            pos[i*3 + 1] += velocities[i*3 + 1] * 0.025;
            pos[i*3 + 2] += velocities[i*3 + 2] * 0.025;

            velocities[i*3]     *= 0.96;
            velocities[i*3 + 1] *= 0.96;
            velocities[i*3 + 2] *= 0.96;
        }

        heartMat.opacity = Math.max(0, heartMat.opacity - 0.015);
    }

    heartGeo.attributes.position.needsUpdate = true;
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
